[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kappa-smc"
version = "0.1.0"
description = "Statistical model checking for stochastic Kappa models"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "kappy; sys_platform != 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]